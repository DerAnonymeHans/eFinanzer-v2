# Serves the built app inside the efinanzer_app container. TLS, /api and /auth are handled by the reverse proxy in
# front of it (src/deploy/nginx.conf).
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # SvelteKit puts a content hash into every file name in /_app/immutable, so they never change and can be cached
    # for good
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Paths without a file are routes of the app, they all get index.html. It is never cached, so a new deployment
    # is picked up with the next page load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
