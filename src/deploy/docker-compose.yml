services:
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      keycloak:
        condition: service_started
      victorialogs:
        condition: service_started
    networks:
      - web-net
    restart: unless-stopped 
    
  efinanzer:
    image: deranonyme/efinanzer:main
    container_name: efinanzer
    environment:
      ConnectionStrings__Database: Host=efinanzer_postgres;Port=5432;Database=${EFINANZER_DB_NAME:-efinanzer};Username=${EFINANZER_DB_USER:-efinanzer};Password=${EFINANZER_DB_PASSWORD}
      KeycloakAdmin__ClientSecret: ${EFINANZER_KEYCLOAK_CLIENT_SECRET}
    depends_on:
      efinanzer_postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - web-net
      - efinanzer-net

  efinanzer_postgres:
    image: postgres:16-alpine
    container_name: efinanzer_postgres
    environment:
      POSTGRES_DB: ${EFINANZER_DB_NAME:-efinanzer}
      POSTGRES_USER: ${EFINANZER_DB_USER:-efinanzer}
      POSTGRES_PASSWORD: ${EFINANZER_DB_PASSWORD}
    volumes:
      - efinanzer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EFINANZER_DB_USER:-efinanzer}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - efinanzer-net
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: efinanzer.stura.htwk-leipzig.de
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    depends_on:
      keycloak_postgres:
        condition: service_healthy
    networks:
      - web-net
      - keycloak-net
    restart: unless-stopped

  keycloak_postgres:
    image: postgres:16-alpine
    container_name: keycloak_postgres
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - keycloak-net
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs
    # Removed direct host port mapping "9428:9428" so traffic must flow via nginx
    volumes:
      - vl_data:/victoria-logs-data
    command:
      - "-retentionPeriod=6M"
      - "-http.pathPrefix=/logs"
    networks:
      - web-net
    restart: unless-stopped

  vector:
    image: timberio/vector:latest-alpine
    container_name: vector
    # --watch-config so edits to vector.yaml apply without recreating the
    # container (a bind-mount change alone does not trigger a recreate).
    command: ["--config", "/etc/vector/vector.yaml", "--watch-config"]
    environment:
      # inotify does not see host edits to a bind-mounted single file reliably
      VECTOR_WATCH_CONFIG_METHOD: poll
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector_data:/vector-data
    depends_on:
      - victorialogs
    networks:
      - web-net
    restart: unless-stopped

networks:
  web-net:
    driver: bridge
  keycloak-net:
    driver: bridge
  efinanzer-net:
    driver: bridge

volumes:
  efinanzer_pgdata:
  keycloak_pgdata:
  vl_data:
  vector_data: