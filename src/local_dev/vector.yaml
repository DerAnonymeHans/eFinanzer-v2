data_dir: /vector-data

sources:
  docker:
    type: docker_logs
    include_containers: ["efinanzer_postgres", "keycloak", "keycloak_postgres", "victorialogs"]

transforms:
  # App logs that are already JSON get lifted into top-level fields so they
  # become queryable in VictoriaLogs; plain text lines pass through untouched.
  lift_json:
    type: remap
    inputs: [docker]
    source: |
      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        . = merge(., object!(parsed), deep: true)
      }

sinks:
  victorialogs:
    type: http
    inputs: [lift_json]
    # /logs prefix is required because VictoriaLogs runs with -http.pathPrefix=/logs
    uri: "http://victorialogs:9428/logs/insert/jsonline?_stream_fields=container_name,stream&_msg_field=message&_time_field=timestamp"
    encoding:
      codec: json
    framing:
      method: newline_delimited
    healthcheck: false
