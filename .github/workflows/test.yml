name: build and test

on:
  push:
  pull_request:
    branches: [ main ]
    paths:
      - '**.cs'
      - '**.csproj'

env:
  DOTNET_VERSION: '10.0.401' # The .NET SDK version to use

jobs:
  build-and-test:

    name: build-and-test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: cd ./src/eFinanzer/Web.Tests && dotnet restore

      - name: Build
        run: cd ./src/eFinanzer/Web.Tests && dotnet build --configuration Release --no-restore

      - name: Test
        run: cd ./src/eFinanzer/Web.Tests && dotnet test --no-restore --verbosity normal
