# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild and push the image even if the app source did not change"
        type: boolean
        default: false

jobs:
  # Decides whether the image actually has to be rebuilt
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app:
              - 'src/eFinanzer/**'

  build:
    needs: changes
    if: needs.changes.outputs.app == 'true' || inputs.force_build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_USERNAME }}/efinanzer

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./src/eFinanzer
          file: ./src/eFinanzer/Web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}

  deploy:
    needs: [ changes, build ]
    # Runs even when "build" was skipped, but not when it failed or was cancelled
    if: |
      always()
      && github.event_name != 'pull_request'
      && needs.changes.result == 'success'
      && needs.build.result != 'failure'
      && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Everything below runs over a single multiplexed SSH connection, so the
      # server's brute-force protection does not see a burst of new sessions.
      - name: Deploy to server
        run: |
          set -eu
          SSH_PORT="${SSH_PORT:-22}"
          TARGET=/home/psetzer/efinanzer

          echo "--- preparing key"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          echo "--- preparing known_hosts"
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "SSH_KNOWN_HOSTS secret is not set, falling back to a single ssh-keyscan"
            ssh-keyscan -t ed25519 -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

          printf '%s\n' \
            "Host deploy" \
            "  HostName $SSH_HOST" \
            "  User $SSH_USER" \
            "  Port $SSH_PORT" \
            "  IdentityFile ~/.ssh/deploy_key" \
            "  IdentitiesOnly yes" \
            "  BatchMode yes" \
            "  ConnectTimeout 20" \
            "  ServerAliveInterval 30" \
            "  ControlMaster auto" \
            "  ControlPath ~/.ssh/cm-%C" \
            "  ControlPersist 300" > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # First command opens the master connection; the rest ride along on it.
          echo "--- creating target directory"
          ssh deploy "mkdir -p $TARGET"

          echo "--- copying compose files"
          scp src/deploy/docker-compose.yml src/deploy/nginx.conf src/deploy/vector.yaml "deploy:$TARGET/"

          echo "--- checking required secrets are present"
          for v in EFINANZER_DB_USER EFINANZER_DB_PASSWORD KEYCLOAK_DB_USER KEYCLOAK_DB_PASSWORD KEYCLOAK_ADMIN_USER KEYCLOAK_ADMIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v resolved to an empty string - check that the secret exists and is visible to this job"
              exit 1
            fi
          done

          echo "--- writing .env"
          printf '%s\n' \
            "EFINANZER_DB_USER=$EFINANZER_DB_USER" \
            "EFINANZER_DB_PASSWORD=$EFINANZER_DB_PASSWORD" \
            "KEYCLOAK_DB_USER=$KEYCLOAK_DB_USER" \
            "KEYCLOAK_DB_PASSWORD=$KEYCLOAK_DB_PASSWORD" \
            "KEYCLOAK_ADMIN_USER=$KEYCLOAK_ADMIN_USER" \
            "KEYCLOAK_ADMIN_PASSWORD=$KEYCLOAK_ADMIN_PASSWORD" \
            | ssh deploy "umask 077; cat > $TARGET/.env"

          echo "--- pulling and starting containers"
          ssh deploy "cd $TARGET && docker compose pull && docker compose up -d --remove-orphans"

          echo "--- done"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          EFINANZER_DB_USER: ${{ secrets.EFINANZER_DB_USER }}
          EFINANZER_DB_PASSWORD: ${{ secrets.EFINANZER_DB_PASSWORD }}
          KEYCLOAK_DB_USER: ${{ secrets.KEYCLOAK_DB_USER }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          KEYCLOAK_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}

      - name: Close SSH master connection
        if: always()
        run: ssh -O exit deploy || true
