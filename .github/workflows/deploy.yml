# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_USERNAME }}/efinanzer
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./src/eFinanzer
          file: ./src/eFinanzer/Web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Copy deploy folder to server
        uses: appleboy/scp-action@v0.1.7
        if: github.event_name != 'pull_request'
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "src/deploy/*"
          target: "/home/psetzer/efinanzer"
          strip_components: 2
          overwrite: true

      - name: Write .env to server
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: EFINANZER_DB_USER,EFINANZER_DB_PASSWORD,KEYCLOAK_DB_USER,KEYCLOAK_DB_PASSWORD,KEYCLOAK_ADMIN_USER,KEYCLOAK_ADMIN_PASSWORD
          script: |
            set -eu
            mkdir -p /home/psetzer/efinanzer
            cd /home/psetzer/efinanzer
            umask 077
            printf '%s\n' \
              "EFINANZER_DB_USER=$EFINANZER_DB_USER" \
              "EFINANZER_DB_PASSWORD=$EFINANZER_DB_PASSWORD" \
              "KEYCLOAK_DB_USER=$KEYCLOAK_DB_USER" \
              "KEYCLOAK_DB_PASSWORD=$KEYCLOAK_DB_PASSWORD" \
              "KEYCLOAK_ADMIN_USER=$KEYCLOAK_ADMIN_USER" \
              "KEYCLOAK_ADMIN_PASSWORD=$KEYCLOAK_ADMIN_PASSWORD" > .env
        env:
          EFINANZER_DB_USER: ${{ secrets.EFINANZER_DB_USER }}
          EFINANZER_DB_PASSWORD: ${{ secrets.EFINANZER_DB_PASSWORD }}
          KEYCLOAK_DB_USER: ${{ secrets.KEYCLOAK_DB_USER }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          KEYCLOAK_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}

      - name: Execute remote deployment commands
        uses: appleboy/ssh-action@v1.2.0
        if: github.event_name != 'pull_request'
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/psetzer/efinanzer
            docker compose pull
            docker compose up -d --remove-orphans

