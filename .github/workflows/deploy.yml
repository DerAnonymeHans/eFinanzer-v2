# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_USERNAME }}/efinanzer
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./src/eFinanzer
          file: ./src/eFinanzer/Web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Copy deploy folder to server
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          SSH_PORT="${SSH_PORT:-22}"
          echo "--- preparing key"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          echo "--- scanning host key on port $SSH_PORT"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "--- host keys collected: $(wc -l < ~/.ssh/known_hosts)"
          echo "--- creating target directory"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'mkdir -p /home/psetzer/efinanzer'
          echo "--- copying files"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            src/deploy/docker-compose.yml src/deploy/nginx.conf \
            "$SSH_USER@$SSH_HOST:/home/psetzer/efinanzer/"
          echo "--- done"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Write .env to server
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: EFINANZER_DB_USER,EFINANZER_DB_PASSWORD,KEYCLOAK_DB_USER,KEYCLOAK_DB_PASSWORD,KEYCLOAK_ADMIN_USER,KEYCLOAK_ADMIN_PASSWORD
          script: |
            set -eu
            mkdir -p /home/psetzer/efinanzer
            cd /home/psetzer/efinanzer
            umask 077
            printf '%s\n' \
              "EFINANZER_DB_USER=$EFINANZER_DB_USER" \
              "EFINANZER_DB_PASSWORD=$EFINANZER_DB_PASSWORD" \
              "KEYCLOAK_DB_USER=$KEYCLOAK_DB_USER" \
              "KEYCLOAK_DB_PASSWORD=$KEYCLOAK_DB_PASSWORD" \
              "KEYCLOAK_ADMIN_USER=$KEYCLOAK_ADMIN_USER" \
              "KEYCLOAK_ADMIN_PASSWORD=$KEYCLOAK_ADMIN_PASSWORD" > .env
        env:
          EFINANZER_DB_USER: ${{ secrets.EFINANZER_DB_USER }}
          EFINANZER_DB_PASSWORD: ${{ secrets.EFINANZER_DB_PASSWORD }}
          KEYCLOAK_DB_USER: ${{ secrets.KEYCLOAK_DB_USER }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          KEYCLOAK_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}

      - name: Execute remote deployment commands
        uses: appleboy/ssh-action@v1.2.0
        if: github.event_name != 'pull_request'
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/psetzer/efinanzer
            docker compose pull
            docker compose up -d --remove-orphans

